<style>
:root{
  --bg:#0f0e0c; --card:#1a1815; --gold:#d4af37; --gold2:#f3d27a;
  --txt:#f0e9d8; --muted:#a89e8a; --line:#2c2823; --input:#201c17;
  --sheet1:#332a18; --sheet2:#241d10;
}
[data-theme="day"]{
  --bg:#faf6ee; --card:#ffffff; --gold:#a5761a; --gold2:#8a6414;
  --txt:#2b2416; --muted:#8a7c60; --line:#e7dcc2; --input:#f3ecdb;
  --sheet1:#fffaf0; --sheet2:#f5ecd8;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI","Noto Sans Myanmar",sans-serif;min-height:100vh;transition:background .3s,color .3s}
header{padding:20px 16px 14px;text-align:center;border-bottom:1px solid var(--line);position:relative}
.logo{width:76px;height:76px;border-radius:20px;border:1.5px solid var(--gold);box-shadow:0 4px 18px rgba(212,175,55,.25);object-fit:cover}
header h1{font-family:Georgia,serif;color:var(--gold2);font-size:1.35rem;margin-top:8px;letter-spacing:.5px}
header p{color:var(--muted);margin-top:6px;font-size:.85rem}
#appear{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--input);font-size:1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt)}
#langbtn{position:absolute;top:14px;left:14px;width:34px;height:34px;border-radius:50%;border:1.2px solid var(--gold);background:var(--input);color:var(--gold2);font-size:.62rem;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#toolbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 12px;transition:transform .28s ease}
#toolbar.hide{transform:translateY(-110%)}
.trow1{display:flex;gap:8px;max-width:920px;margin:0 auto}
#search{flex:1;background:var(--input);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px 14px;font-size:.95rem;outline:none}
#search:focus{border-color:var(--gold)}
#filterbtn{background:var(--input);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:0 13px;font-size:1.05rem;cursor:pointer}
#filterbtn.on{border-color:var(--gold);color:var(--gold2)}
.tabs{display:flex;gap:8px;max-width:920px;margin:9px auto 0;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs{user-select:none;-webkit-user-select:none;touch-action:pan-x}
.tabs{cursor:grab}
.tabs.dragging{cursor:grabbing;user-select:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:var(--input);border:1px solid var(--line);color:var(--muted);border-radius:18px;padding:7px 14px;font-size:.83rem;cursor:pointer;white-space:nowrap}
.tab.active{background:var(--gold);color:#1a1408;border-color:var(--gold);font-weight:700}
#catpanel{display:none;max-width:920px;margin:9px auto 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;max-height:220px;overflow-y:auto}
#catpanel.open{display:block}
.catchip{display:inline-block;background:var(--input);border:1px solid var(--line);color:var(--txt);border-radius:14px;padding:6px 12px;font-size:.78rem;margin:3px;cursor:pointer}
.catchip.active{background:var(--gold);color:#1a1408;border-color:var(--gold);font-weight:700}
main{max-width:920px;margin:0 auto;padding:12px 12px 90px}
#result{color:var(--muted);font-size:.8rem;margin:2px 2px 10px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;align-items:center;gap:10px;cursor:pointer}
.row:active{border-color:var(--gold)}
.row .tx{flex:1;min-width:0;font-size:.87rem;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rh{flex:0 0 auto;display:flex;align-items:center;gap:6px}
.mini-fav{background:none;border:none;font-size:1rem;cursor:pointer;padding:4px}
.row .chev{color:var(--muted);font-size:.9rem}
.empty{color:var(--muted);text-align:center;padding:44px 20px;line-height:1.8}
/* modal */
#overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.45)}
#overlay.show{display:flex}
body.modal-open #pagewrap{filter:blur(10px) brightness(.5);pointer-events:none;user-select:none}
.sheet{background:linear-gradient(160deg,var(--sheet1),var(--sheet2));border:1.5px solid var(--gold);border-radius:20px;width:100%;max-width:420px;height:75%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 36px rgba(212,175,55,.20);animation:pop .22s ease}
@media(min-width:700px){ .sheet{width:640px;max-width:calc(100% - 60px);height:auto;max-height:85%;} }
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.sheet-head{padding:24px 22px 0;flex:0 0 auto}
.sheet-head .em-big{font-size:1.7rem}
.sheet-scroll{flex:1;overflow-y:auto;min-height:0;padding:0 22px;-webkit-overflow-scrolling:touch}
.sheet-foot{flex:0 0 auto;padding:14px 22px 20px;border-top:1px solid var(--line);background:rgba(0,0,0,.15)}
.badge{display:inline-block;font-size:.7rem;color:var(--muted);background:var(--input);border-radius:7px;padding:3px 9px;margin:10px 0 14px}
.en-tag,.mm-tag{display:inline-block;font-size:.65rem;font-weight:700;border-radius:5px;padding:2px 8px;margin-bottom:8px;letter-spacing:1px}
.en-tag{background:rgba(212,175,55,.15);color:var(--gold2);border:1px solid var(--gold)}
.mm-tag{background:rgba(232,220,192,.07);color:var(--muted);border:1px solid var(--line)}
.en-text{font-size:1.02rem;line-height:1.65;font-weight:600}
.divider{border:none;border-top:1px dashed var(--line);margin:16px 0}
.mm-text{font-size:1.02rem;line-height:1.75}
.iconrow{display:flex;justify-content:space-between;align-items:center;padding:0 12px}
.icobtn{width:28px;height:28px;border-radius:50%;border:1.2px solid var(--gold);background:transparent;font-size:.78rem;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt)}
.icobtn:active{transform:scale(.9)}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--gold);color:#1a1408;padding:12px 22px;border-radius:24px;font-weight:700;font-size:.9rem;opacity:0;transition:.25s;pointer-events:none;z-index:60}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

rything except the lips and jewelry", "mm": "🎨 နှုတ်ခမ်းနှင့် လက်ဝတ်ရတနာများမှအပ ကျန်ရှိသောအရာအားလုံး၏ အရောင်ကို ဖျော့တော့စေပါ"}, {"collection": "studio", "category": "💡 Lighting & Grade", "num": 226, "text": "🎨 Add a subtle S-curve contrast for a filmic feel", "mm": "🎨 ရုပ်ရှင်ဆန်သောအသွင်ဖြစ်စေရန် သိမ်မွေ့သော S-curve ကွန်ထရက် (contrast) ကို ထည့်သွင်းပါ"}, {"collection": "studio", "category": "💡 Lighting & Grade", "num": 227, "text": "🎨 Lift the blacks for a soft faded film look", "mm": "🎨 ဖလင်ဟောင်းရုပ်ထွက်ရရှိရန် အနက်ရောင်များကို အပေါ်သို့ အနည်းငယ်မြှင့်တင်ပါ (lift the blacks)"}, {"collection": "studio", "category": "💡 Lighting & Grade", "num": 228, "text": "🎨 Crush the blacks for a bold punchy look", "mm": "🎨 ပြတ်သားရဲရင့်သောအသွင်ရစေရန် အနက်ရောင်များကို ပိုမိုနက်မှောင်သွားအောင် ဖိချပါ (crush the blacks)"}, {"collection": "studio", "category": "💡 Lighting & Grade", "num": 229, "text": "🎨 Soften the highlight rolloff for a gentle glow", "mm": "🎨 နူးညံ့သောအလင်းပြေပြေရရှိစေရန် အလင်းတောက်ပမှုအနားသတ်များ (highlight rolloff) ကို ပျော့ပြောင်းစေပါ"}, {"collection": "studio", "category": "💡 Lighting & Grade", "num": 230, "text": "🎨 Tint the shadows warm amber", "mm": "🎨 အရိပ်ကျသောနေရာများ (shadows) ကို ပယင်းရောင်နွေးနွေး (warm amber) အရောင်ဆိုးပါ"}, {"collection": "studio", "category": "💡 Lighting & Grade", "num": 231, "text": "🎨 Tint the shadows cool blue", "mm": "🎨 အရိပ်ကျသောနေရာများကို အပြာရောင်အေးအေး အရောင်ဆိုးပါ"}, {"collection": "studio", "category": "💡 Lighting & Grade", "num": 232, "text": "🎨 Tint the highlights soft gold", "mm": "🎨 အလင်းကျသောနေရာများ (highlights) ကို ရွှေရောင်ဖျော့ဖျော့ အရောင်ဆိုးပါ"}, {"collection": "studio", "category": "💡 Lighting & Grade", "num": 233, "text": "🎨 Tint the highlights soft pink", "mm": "🎨 အလင်းကျသောနေရာများကို ပန်းရောင်နုနု အရောင်ဆိုးပါ"}, {"collection": "studio", "category": "💡 Lighting & Grade", "num": 234, "text": "🎨 Warm the whites slightly for a cozy feel", "mm": "🎨 သက်တောင့်သက်သာရှိသောအသွင်ဖြစ်စေရန် အဖြူရောင်များကို အနည်းငယ function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function showToast(t){ toast.textContent=t; toast.classList.add('show'); clearTimeout(showToast._t); showToast._t=setTimeout(()=>toast.classList.remove('show'),1400); }
function fallbackCopy(t){ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.top='0'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select(); try{ document.execCommand('copy'); }catch(e){} document.body.removeChild(ta); }
function copyText(t){ if(navigator.clipboard&&navigator.clipboard.writeText){ return navigator.clipboard.writeText(t).catch(function(){ fallbackCopy(t); }); } fallbackCopy(t); return Promise.resolve(); }
function stripEmoji(s){ s=String(s); const m=s.match(/^(\p{Extended_Pictographic}(\uFE0F|\u200D\p{Extended_Pictographic}\uFE0F?)*\s*)+/u); return (m?s.slice(m[0].length):s).trim(); }
function firstEmoji(s){ const m=String(s).match(/^(\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic}\uFE0F?)*)/u); return m?m[1]:'✨'; }
function orderedCats(){
  const seen=new Set(), out=[];

  cols.forEach(k=>{ (CAT_ORDER[k]||[]).forEach(c=>{ if(!seen.has(c)){ seen.add(c); out.push(c); } }); });
  return out;
}
function buildCats(){

    cats.map(c=>'<button class="catchip'+(cat===c?' active':'')+'" data-c="'+esc(c)+'">'+esc(c)+' ('+counts[c]+')</button>').join('');
}
function filtered(){

    if(coll==='fav'&&!favSet.has(i)) return false;
    if(coll!=='all'&&coll!=='fav'&&c.collection!==coll) return false;
    if(cat&&c.category!==cat) return false;
    if(q&&!(c.text.toLowerCase().includes(q)||(c.mm||'').toLowerCase().includes(q)||c.category.toLowerCase().includes(q))) return false;
    return true;
  });
}

/* tab bar: drag-to-scroll (mouse/pen) + wheel-to-horizontal */
(function(){
  const tabsEl=document.getElementById('tabs');
  let isDown=false, startX=0, startScroll=0, moved=0;
  tabsEl.addEventListener('pointerdown',e=>{
    if(e.pointerType==='touch') return;
    isDown=true; moved=0; startX=e.clientX; startScroll=tabsEl.scrollLeft;
    tabsEl.classList.add('dragging');
  });
  tabsEl.addEventListener('pointermove',e=>{
    if(!isDown) return;
    const dx=e.clientX-startX;
    moved=Math.max(moved,Math.abs(dx));
    tabsEl.scrollLeft=startScroll-dx;
  });
  function endDrag(){
    if(!isDown) return;
    isDown=false; tabsEl.classList.remove('dragging');
    if(moved>6){ window.__tabsDragged=true; setTimeout(()=>{ window.__tabsDragged=false; },150); }
  }
  window.addEventListener('pointerup',endDrag);
  window.addEventListener('pointercancel',endDrag);
  tabsEl.addEventListener('wheel',e=>{
    if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){ e.preventDefault(); tabsEl.scrollLeft+=e.deltaY; }
  },{passive:false});
})();

/* tab bar: mouse-event drag fallback (covers environments that don't deliver pointer events) */
(function(){
  const tabsEl=document.getElementById('tabs');
  let down=false, sx=0, ss=0, mv=0;
  tabsEl.addEventListener('mousedown',e=>{
    if(e.button!==0) return;
    down=true; mv=0; sx=e.clientX; ss=tabsEl.scrollLeft;
    tabsEl.classList.add('dragging');
  });
  window.addEventListener('mousemove',e=>{
    if(!down) return;
    const dx=e.clientX-sx;
    mv=Math.max(mv,Math.abs(dx));
    tabsEl.scrollLeft=ss-dx;
  });
  function up(){
    if(!down) return;
    down=false; tabsEl.classList.remove('dragging');
    if(mv>6){ window.__tabsDragged=true; setTimeout(()=>{ window.__tabsDragged=false; },150); }
  }
  window.addEventListener('mouseup',up);
})();
