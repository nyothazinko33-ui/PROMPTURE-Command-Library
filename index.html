<style>
:root{
  --bg:#0f0e0c; --card:#1a1815; --gold:#d4af37; --gold2:#f3d27a;
  --txt:#f0e9d8; --muted:#a89e8a; --line:#2c2823; --input:#201c17;
  --sheet1:#332a18; --sheet2:#241d10; --mmbg:rgba(212,175,55,.08);
}
[data-theme="day"]{
  --bg:#faf6ee; --card:#ffffff; --gold:#a5761a; --gold2:#8a6414;
  --txt:#2b2416; --muted:#8a7c60; --line:#e7dcc2; --input:#f3ecdb;
  --sheet1:#fffaf0; --sheet2:#f5ecd8; --mmbg:rgba(165,118,26,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI","Noto Sans Myanmar",sans-serif;min-height:100vh;transition:background .3s,color .3s}
/* header */
header{padding:20px 16px 14px;text-align:center;border-bottom:1px solid var(--line);position:relative}
.logo{width:76px;height:76px;border-radius:20px;border:1.5px solid var(--gold);box-shadow:0 4px 18px rgba(212,175,55,.25);object-fit:cover}
header h1{font-family:Georgia,serif;color:var(--gold2);font-size:1.35rem;margin-top:8px;letter-spacing:.5px}
header p{color:var(--muted);margin-top:6px;font-size:.85rem}
#appear{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--input);font-size:1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt)}
/* toolbar */
#toolbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 12px;transition:transform .28s ease}
#toolbar.hide{transform:translateY(-110%)}
.trow1{display:flex;gap:8px;max-width:920px;margin:0 auto}
#search{flex:1;background:var(--input);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px 14px;font-size:.95rem;outline:none}
#search:focus{border-color:var(--gold)}
#filterbtn{background:var(--input);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:0 13px;font-size:1.05rem;cursor:pointer}
#filterbtn.on{border-color:var(--gold);color:var(--gold2)}
.tabs{display:flex;gap:8px;max-width:920px;margin:9px auto 0;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:var(--input);border:1px solid var(--line);color:var(--muted);border-radius:18px;padding:7px 14px;font-size:.83rem;cursor:pointer;white-space:nowrap}
.tab.active{background:var(--gold);color:#1a1408;border-color:var(--gold);font-weight:700}
/* category panel */
#catpanel{display:none;max-width:920px;margin:9px auto 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;max-height:220px;overflow-y:auto}
#catpanel.open{display:block}
.catchip{display:inline-block;background:var(--input);border:1px solid var(--line);color:var(--txt);border-radius:14px;padding:6px 12px;font-size:.78rem;margin:3px;cursor:pointer}
.catchip.active{background:var(--gold);color:#1a1408;border-color:var(--gold);font-weight:700}
/* list */
main{max-width:920px;margin:0 auto;padding:12px 12px 90px}
#result{color:var(--muted);font-size:.8rem;margin:2px 2px 10px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:border-color .15s}
.row:active{border-color:var(--gold)}
.row .em{font-size:1.15rem;flex:0 0 auto}
.row .tx{flex:1;min-width:0;font-size:.87rem;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rh{flex:0 0 auto;display:flex;align-items:center;gap:6px}
.mini-fav{background:none;border:none;font-size:1rem;cursor:pointer;padding:4px}
.row .chev{color:var(--muted);font-size:.9rem}
.empty{color:var(--muted);text-align:center;padding:44px 20px;line-height:1.8}
/* modal */
#overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(0,0,0,.45)}
#overlay.show{display:flex}
#overlay.blurbg ~ *{}
body.modal-open #pagewrap{filter:blur(9px) brightness(.55);pointer-events:none;user-select:none}
.sheet{background:linear-gradient(160deg,var(--sheet1),var(--sheet2));border:1.5px solid var(--gold);border-radius:20px;padding:22px 20px;width:100%;max-width:420px;max-height:82vh;overflow-y:auto;box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 36px rgba(212,175,55,.20);animation:pop .22s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.sheet .em-big{font-size:1.7rem}
.sheet .fullcmd{font-size:1rem;line-height:1.6;margin:10px 0 6px;font-weight:600}
.badge{display:inline-block;font-size:.7rem;color:var(--muted);background:var(--input);border-radius:7px;padding:3px 9px;margin-bottom:4px}
.mm{background:var(--mmbg);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:9px 11px;font-size:.85rem;line-height:1.65;margin:10px 0 16px}
.mm b{color:var(--gold2)}
.iconrow{display:flex;justify-content:space-between;align-items:center;padding:0 10px}
.icobtn{width:28px;height:28px;border-radius:50%;border:1.2px solid var(--gold);background:transparent;font-size:.8rem;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt)}
.icobtn:active{transform:scale(.9)}
.hintline{text-align:center;color:var(--muted);font-size:.7rem;margin-top:14px}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--gold);color:#1a1408;padding:12px 22px;border-radius:24px;font-weight:700;font-size:.9rem;opacity:0;transition:.25s;pointer-events:none;z-index:60}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{text-align:center;color:var(--muted);font-size:.75rem;padding:22px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div id="pagewrap">

  result.textContent='တွေ့ရှိချက်: '+list.length+' commands'+(search.value.trim()?' · "'+search.value.trim()+'"':'');
  if(!list.length){
    rows.innerHTML='<div class="empty">'+(coll==='fav'?'⭐ အကြိုက်ဆုံး မရှိသေးပါ<br>ကြိုက်တဲ့ command ကို ထိပြီး 🤍 နှိပ်ထားနော် 💛':'မတွေ့ပါ — တခြားစကားလုံးနဲ့ ရှာကြည့်ပါနော် 🔍')+'</div>';
    return;
  }
  rows.innerHTML=list.map(({c,i})=>'<div class="row" data-i="'+i+'"><span class="em">'+firstEmoji(c.text)+'</span><span class="tx">'+esc(c.text)+'</span><span class="rh"><button class="mini-fav" data-i="'+i+'">'+(favSet.has(i)?'❤️':'🤍')+'</button><span class="chev">›</span></span></div>').join('');
}
function openModal(i){
  const c=COMMANDS[i];
  sheet.innerHTML='<span class="em-big">'+firstEmoji(c.text)+'</span>'+
    '<div class="fullcmd">'+esc(c.text)+'</div>'+
    '<span class="badge">'+esc(COLL_NAME[c.collection])+' · '+esc(c.category)+' · #'+c.num+'</span>'+
    (c.mm?'<div class="mm">💬 <b>ရှင်းလင်းချက်:</b> '+esc(c.mm)+'</div>':'')+
    '<div class="iconrow"><button class="icobtn" id="mcopy" title="ကူးယူ">📋</button>'+
    '<button class="icobtn" id="mfav" title="အကြိုက်ဆုံး">'+(favSet.has(i)?'❤️':'🤍')+'</button></div>'+
    '<div class="hintline">အပြင်ဘက် နှိပ်ရင် ပိတ်သွားမယ် ✕</div>';
  overlay.classList.add('show'); document.body.classList.add('modal-open');
  document.getElementById('mcopy').onclick=(e)=>{ e.stopPropagation();
    navigator.clipboard.writeText(c.text).then(()=>showToast('ကူးယူပြီးပါပြီ ✅')); };
  document.getElementById('mfav').onclick=(e)=>{ e.stopPropagation();
    if(favSet.has(i)){favSet.delete(i);}else{favSet.add(i);showToast('အကြိုက်ဆုံးထဲ သိမ်းပြီးပါပြီ ⭐');}
    saveFavs(); openModal(i); render(); };
}
function closeModal(){ overlay.classList.remove('show'); document.body.classList.remove('modal-open'); }
overlay.addEventListener('click',e=>{ if(e.target===overlay) closeModal(); });
rows.addEventListener('click',e=>{
  const mf=e.target.closest('.mini-fav');
  if(mf){ e.stopPropagation(); const i=+mf.dataset.i;
    if(favSet.has(i)){favSet.delete(i);}else{favSet.add(i);showToast('အကြိုက်ဆုံးထဲ သိမ်းပြီးပါပြီ ⭐');}
    saveFavs(); render(); return; }
  const r=e.target.closest('.row'); if(r) openModal(+r.dataset.i);
});
document.getElementById('tabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab'); if(!t) return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); coll=t.dataset.coll; cat=''; filterbtn.classList.remove('on'); catpanel.classList.remove('open');
  buildCats(); render();
});
filterbtn.addEventListener('click',()=>{ catpanel.classList.toggle('open'); filterbtn.classList.toggle('on'); });
catpanel.addEventListener('click',e=>{
  const b=e.target.closest('.catchip'); if(!b) return;
  cat=b.dataset.c; buildCats(); render();
});
search.addEventListener('input',render);
/* auto-hide toolbar */
let lastY=0;
window.addEventListener('scroll',()=>{
  const y=window.scrollY;
  if(document.body.classList.contains('modal-open')) return;
  if(y>lastY&&y>120){ toolbar.classList.add('hide'); }
  else if(y<lastY){ toolbar.classList.remove('hide'); }
  lastY=y;
},{passive:true});
/* appearance: day / night / system */
const appear=document.getElementById('appear');
const THEMES=['night','day','system'], ICONS={night:'🌙',day:'☀️',system:'📱'};
let theme=localStorage.getItem('prompture_cmd_theme')||'night';
function applyTheme(){
  let eff=theme;
  if(theme==='system'){ eff=window.matchMedia('(prefers-color-scheme: light)').matches?'day':'night'; }
  document.documentElement.dataset.theme=eff;
  appear.textContent=ICONS[theme];
}
appear.addEventListener('click',()=>{
  theme=THEMES[(THEMES.indexOf(theme)+1)%THEMES.length];
  localStorage.setItem('prompture_cmd_theme',theme); applyTheme();
  showToast(theme==='day'?'☀️ Day mode':theme==='night'?'🌙 Night mode':'📱 System mode');
});
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{ if(theme==='system') applyTheme(); });
applyTheme(); saveFavs(); buildCats(); render();
</script>
</body>
</html>
